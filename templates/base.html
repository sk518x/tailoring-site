<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}{{ business_name }}{% endblock %}</title>
  </head>
  <body>
    <header>
      <h1>{{ business_name }}</h1>
      <nav>
        <a href="/">Home</a>
        <a href="/services">Services</a>
        <a href="/gallery">Gallery</a>
      </nav>
    </header>

    <main>{% block content %}{% endblock %}</main>

    <footer>
      <a
        href="https://wa.me/{{ whatsapp_number }}?text={{ whatsapp_message | urlencode }}"
        >Chat on WhatsApp</a
      >
    </footer>
  </body>
</html>
