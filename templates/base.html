<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}{{ business_name }}{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <div class="page-background"></div>
   <header>
    <h1>{{ business_name }}</h1>
   
  <nav>
    <a href="/"{% if request.path == '/' %} aria-current="page"{% endif %}>Home</a>
    <a href="/services"{% if request.path == '/services' or request.path.startswith('/services/') %} aria-current="page"{% endif %}>Services</a>
    <a href="/contact"{% if request.path == '/contact' %} aria-current="page"{% endif %}>Contact</a>
    <a href="/enquire"{% if request.path == '/enquire' %} aria-current="page"{% endif %}>Enquire</a>
  </nav>

</header>
    {% block banner %}
    {% endblock %}
    <main>{% block content %}{% endblock %}</main>

    <footer>
      <p>{{ business_name }} &middot; {{ opening_hours }}</p>
      <p><a href="/privacy">Privacy</a></p>
    </footer>
  </body>
</html>
