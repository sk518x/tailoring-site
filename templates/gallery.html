{% extends "base.html" %} {% block title %}Gallery - {{ business_name }}{%
endblock %} {% block content %}
<h2>Gallery</h2>

{% for category, group in items | groupby("category") %}
<h3>{{ category }}</h3>
{% for item in group %}
<div>
  <img
    src="{{ url_for('static', filename='images/' ~ item.image) }}"
    alt="{{ item.title }}"
    width="300"
  />
  <h4>{{ item.title }}</h4>
  <a
    href="https://wa.me/{{ whatsapp_number }}?text={{ ('Hi, I am interested in the ' ~ item.title ~ ' shown on your site') | urlencode }}"
    >Enquire on WhatsApp</a
  >
</div>
{% endfor %} {% endfor %} {% endblock %}
